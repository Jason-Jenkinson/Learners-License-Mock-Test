<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://fonts.googleapis.com/css?family=Inter&display=swap"
      rel="stylesheet"
    />
    <link href="./css/test-question.css" rel="stylesheet" />
    <title>Practice Test</title>
    <script src="./js/api.js" defer></script>
    <script src="./js/quiz.js" defer></script>
  </head>
  <body>
    <main class="quiz-shell">
      <header class="quiz-header">
        <a class="brand-link" href="./start-test.html">Learners Licence Practice</a>
        <div class="quiz-status">
          <div class="progress-copy">
            <p id="question-count">Loading question…</p>
            <p id="answered-count"></p>
          </div>
          <div class="timer" aria-label="Time remaining">
            <span aria-hidden="true">Time left</span>
            <strong id="timer" aria-live="off">20:00</strong>
          </div>
        </div>
        <progress id="quiz-progress" value="0" max="64" aria-label="Test progress"></progress>
      </header>

      <section class="question-card" aria-labelledby="question-text">
        <p class="question-kicker" id="question-number">Question</p>
        <h1 id="question-text" tabindex="-1">Loading your test…</h1>
        <img id="question-image" alt="" hidden />
        <fieldset class="answer-list">
          <legend class="visually-hidden">Choose one answer</legend>
          <div id="answer-options"></div>
        </fieldset>
        <p class="error-message" id="quiz-error" role="alert" hidden></p>
      </section>

      <footer class="quiz-footer">
        <a class="text-link" id="exit-link" href="./start-test.html">Exit test</a>
        <div class="navigation-controls">
          <button class="button button-secondary" id="previous-button" type="button">
            Previous
          </button>
          <button class="button button-primary" id="next-button" type="button">
            Next
          </button>
          <button class="button button-primary" id="finish-button" type="button">
            Finish test
          </button>
        </div>
      </footer>
    </main>
  </body>
</html>
